name: Lot E V6 — Smoke production lecture seule
on:
  pull_request:
    paths:
      - '.github/workflows/lot-e-v6-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke-live:
    runs-on: ubuntu-latest
    steps:
      - name: Health, front-end assets and private endpoint isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.error
          base="https://stef-match-center.onrender.com"
          def get(path):
              req=urllib.request.Request(base+path,headers={"User-Agent":"STEF-lot-e-v6-read-only-smoke"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=35) as r:
                          return r.status,r.read(),dict(r.headers)
                  except urllib.error.HTTPError as err:
                      return err.code,err.read(),dict(err.headers)
                  except Exception:
                      if attempt==4: raise
                      time.sleep(4)
          status,body,headers=get("/api/health")
          assert status==200 and json.loads(body).get("ok") is True,(status,body[:200])
          print("PASS /api/health HTTP 200")
          status,html,_=get("/")
          assert status==200 and b'<div id="root">' in html
          print("PASS / HTML 200")
          assets=re.findall(rb'(?:src|href)="(/assets/[^"]+)"',html)
          assert assets, "Bundle assets missing"
          for asset in assets[:3]:
              status,body,_=get(asset.decode())
              assert status==200 and len(body)>100
          print("PASS frontend assets 200")
          status,body,_=get("/api/agencies")
          assert status==200 and isinstance(json.loads(body).get("agencies"),list)
          print("PASS /api/agencies 200")
          for path in [
              "/api/agencies/058/snapshot",
              "/api/agencies/058/export/profile",
              "/api/agencies/058/export/match.pdf",
              "/api/agencies/058/safety",
              "/api/agencies/058/league-configs",
              "/api/agencies/058/causerie?matchDate=2026-11-10"
          ]:
              status,body,_=get(path)
              assert status==401,(path,status,body[:180])
              print("PASS private",path,"401")
          print("LOT E V6 LIVE HTTP SMOKE PASS - no data modified")
          PY
