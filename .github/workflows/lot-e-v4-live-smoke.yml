name: Smoke HTTP production - Lot E V4 (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/lot-e-v4-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check health, assets and agency authorization without writing data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error, re
          BASE = "https://stef-match-center.onrender.com"
          def get(path):
              req=urllib.request.Request(BASE+path, headers={"User-Agent":"STEF-lot-e-v4-post-deploy-check"})
              for retry in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status,r.read(),dict(r.headers)
                  except urllib.error.HTTPError as err:
                      return err.code,err.read(),dict(err.headers)
                  except Exception:
                      if retry == 4: raise
                      time.sleep(5)
          status, content, _ = get("/api/health")
          assert status == 200 and json.loads(content).get("ok") is True, (status,content[:200])
          print("PASS /api/health 200")
          status,html,_=get("/")
          assert status == 200 and b'<div id="root">' in html, (status,html[:300])
          print("PASS / 200")
          asset_match=re.search(rb'(?:src|href)="(/assets/[^"]+)"',html)
          assert asset_match, "No frontend asset"
          status,content,_=get(asset_match.group(1).decode())
          assert status == 200 and len(content)>100
          print("PASS /assets/ 200")
          status,content,_=get("/api/agencies")
          assert status == 200 and isinstance(json.loads(content).get("agencies"), list)
          print("PASS /api/agencies 200")
          for endpoint in [
            "/api/agencies/058/snapshot",
            "/api/agencies/058/export/profile",
            "/api/agencies/058/export/match.pdf",
            "/api/agencies/058/causerie?matchDate=2026-11-10",
            "/api/agencies/058/safety",
            "/api/agencies/058/league-configs",
          ]:
              status,body,_=get(endpoint)
              assert status == 401,(endpoint,status,body[:150])
              print("PASS secured",endpoint,": 401")
          print("LOT E V4 LIVE SMOKE PASS - no data were written")
          PY
