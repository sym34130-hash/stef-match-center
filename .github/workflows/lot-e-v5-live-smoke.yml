name: Lot E V5 - production HTTP smoke (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/lot-e-v5-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke-live:
    runs-on: ubuntu-latest
    steps:
      - name: Test public endpoints and unauthorized access, with no writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time, re
          base="https://stef-match-center.onrender.com"
          def get(path):
              req=urllib.request.Request(base+path,headers={"User-Agent":"STEF-V5-postdeploy-audit"})
              for step in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=35) as r:
                          return r.status,r.read(),dict(r.headers)
                  except urllib.error.HTTPError as e: return e.code,e.read(),dict(e.headers)
                  except Exception:
                      if step == 4: raise
                      time.sleep(5)
          status,body,_=get("/api/health")
          assert status == 200 and json.loads(body).get("ok") is True
          print("PASS /api/health 200 ok")
          status,html,_=get("/")
          assert status == 200 and b'<div id="root">' in html
          print("PASS homepage 200")
          assets=re.findall(rb'(?:src|href)="(/assets/[^"]+)"',html)
          assert assets,"Missing bundled assets"
          for asset in assets[:2]:
              status,body,_=get(asset.decode())
              assert status == 200 and len(body) > 100
          print("PASS frontend assets")
          status,body,_=get("/api/agencies")
          assert status == 200 and isinstance(json.loads(body).get("agencies"),list)
          print("PASS agency directory")
          for path in [
              "/api/agencies/058/snapshot",
              "/api/agencies/058/export/profile",
              "/api/agencies/058/export/match.pdf",
              "/api/agencies/058/safety",
              "/api/agencies/058/league-configs",
              "/api/agencies/058/causerie?matchDate=2026-11-10",
          ]:
              status,body,_=get(path)
              assert status == 401,(path,status,body[:120])
              print("PASS private endpoint",path,"401")
          print("V5 POSTDEPLOY SMOKE PASS. No production data modified.")
          PY
