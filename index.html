<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071833" />
    <title>STEF Match Center</title>
    <style>
      .login-signature {
        position: absolute;
        left: 50%;
        bottom: 38px;
        display: inline-grid;
        justify-items: center;
        gap: 4px;
        width: max-content;
        max-width: min(360px, calc(100% - 92px));
        padding: 12px 14px;
        color: #ffffff;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(6, 22, 45, 0.42);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        transform: translateX(-50%);
      }

      .login-signature span {
        color: #89c6ff;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .login-signature strong {
        font-size: 16px;
        line-height: 1.1;
      }

      @media (max-width: 900px) {
        .login-signature {
          left: 50%;
          bottom: 26px;
          width: calc(100% - 60px);
          max-width: 360px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const addCreatorSignature = () => {
          const visual = document.querySelector(".login-visual");
          if (!visual || visual.querySelector(".login-signature")) return;

          const signature = document.createElement("div");
          signature.className = "login-signature";
          signature.setAttribute("aria-label", "Signature de réalisation");
          signature.innerHTML = "<span>Réalisé par</span><strong>Arnaud Szymaniak</strong>";
          visual.appendChild(signature);
        };

        addCreatorSignature();
        new MutationObserver(addCreatorSignature).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
